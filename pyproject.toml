[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-ai-moderation"
version = "1.0.0"
description = "A Discord moderation bot with a local Russian toxicity scoring model"
requires-python = ">=3.12"
dependencies = [
    "discord.py==2.5.2",
    "python-dotenv==1.0.1",
    "joblib==1.5.3",
    "numpy==2.5.1",
    "scikit-learn==1.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
